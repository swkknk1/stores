<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Official Physical Media Directory - Barnes & Noble, Hungry Ear Records, eBay, BOOK·OFF">
  <meta name="theme-color" content="#090d16">
  <title>Stores Portal | Physical Media Directory</title>
  <style>
    /* Reset & Design Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090d16;
      --card-radius: 1.25rem;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.8) 0%, transparent 60%);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-block: 2.5rem;
      padding-inline: 1.25rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: stretch;
    }

    /* Minimalist Portal Header */
    .portal-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding-block: 0.25rem;
      padding-inline: 0.75rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.75rem;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .portal-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .portal-title {
      font-size: 1.375rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    /* Buttons Container */
    .buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 1.125rem;
    }

    /* Common Logo Button Card Styles */
    .logo-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 102px;
      padding-block: 1rem 0.85rem;
      padding-inline: 1.25rem;
      border-radius: var(--card-radius);
      text-decoration: none;
      outline: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      transition: var(--transition);
      overflow: hidden;
    }

    .logo-btn:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 3px;
    }

    .logo-btn:hover {
      transform: translateY(-3px) scale(1.01);
    }

    .logo-btn:active {
      transform: scale(0.975);
    }

    /* Mini external link icon badge in corner */
    .logo-btn-link-icon {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.65;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .logo-btn-link-icon svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .logo-btn:hover .logo-btn-link-icon {
      opacity: 1;
      transform: translate(1px, -1px);
    }

    /* ========================================================
       1. Barnes & Noble Button
       ======================================================== */
    .btn-bn {
      background: linear-gradient(135deg, #00594C 0%, #003e35 100%);
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 10px 25px -4px rgba(0, 89, 76, 0.45),
                  0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .btn-bn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(212, 175, 55, 0.18) 0%, transparent 60%);
      pointer-events: none;
    }

    .btn-bn:hover {
      box-shadow: 0 14px 30px -4px rgba(0, 89, 76, 0.6),
                  0 0 20px rgba(212, 175, 55, 0.35);
      border-color: rgba(212, 175, 55, 0.7);
    }

    .btn-bn img {
      max-height: 40px;
      width: auto;
      max-width: 86%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .btn-bn .logo-btn-link-icon {
      color: #fef08a;
      background: rgba(212, 175, 55, 0.2);
    }

    /* ========================================================
       2. Hungry Ear Records Button (Enlarged Script Logo on Vintage Vinyl Cream)
       ======================================================== */
    .btn-he {
      background: linear-gradient(135deg, #FFFDF5 0%, #FEF3C7 100%);
      border: 1px solid rgba(217, 119, 6, 0.45);
      box-shadow: 0 10px 25px -4px rgba(245, 158, 11, 0.22),
                  0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .btn-he:hover {
      box-shadow: 0 16px 32px -4px rgba(217, 119, 6, 0.35),
                  0 0 25px rgba(245, 158, 11, 0.4);
      border-color: #d97706;
    }

    .btn-he .logo-box {
      height: 74px; /* Enlarged height box */
    }

    .btn-he img,
    .btn-he svg {
      height: 72px;
      max-height: 74px;
      width: auto;
      max-width: 92%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.12));
    }

    .btn-he .logo-btn-link-icon {
      color: #b45309;
      background: rgba(217, 119, 6, 0.12);
    }

    /* ========================================================
       3. eBay Button
       ======================================================== */
    .btn-ebay {
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.12),
                  0 4px 10px rgba(0, 100, 210, 0.15);
    }

    .btn-ebay:hover {
      box-shadow: 0 16px 32px -4px rgba(0, 0, 0, 0.2),
                  0 0 25px rgba(0, 100, 210, 0.3);
      border-color: #0064d2;
    }

    .btn-ebay img,
    .btn-ebay svg {
      max-height: 48px;
      width: auto;
      max-width: 82%;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.08));
    }

    .btn-ebay .logo-btn-link-icon {
      color: #0064d2;
      background: rgba(0, 100, 210, 0.1);
    }

    /* ========================================================
       4. BOOK·OFF Button (Cropped Logo)
       ======================================================== */
    .btn-bookoff {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.7),
                  0 0 15px rgba(255, 255, 255, 0.1);
    }

    .btn-bookoff:hover {
      box-shadow: 0 14px 30px -4px rgba(0, 0, 0, 0.9),
                  0 0 25px rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .btn-bookoff img {
      max-height: 52px;
      width: auto;
      max-width: 88%;
      filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.25));
    }

    .btn-bookoff .logo-btn-link-icon {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.18);
    }

    /* Logo Box & Physical Media Tags Row */
    .logo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 54px;
    }

    /* Strict Single Horizontal Row without Wrapping */
    .media-tags {
      margin-top: 0.55rem;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-inline: 0.25rem;
    }

    .media-tags::-webkit-scrollbar {
      display: none;
    }

    .media-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding-block: 0.2rem;
      padding-inline: 0.52rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 550;
      letter-spacing: 0.02em;
      line-height: 1.2;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
    }

    /* Tag themes per store */
    .btn-bn .media-tag {
      background: rgba(255, 255, 255, 0.14);
      color: #fef08a;
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    .btn-he .media-tag {
      background: rgba(180, 83, 9, 0.09);
      color: #78350f;
      border: 1px solid rgba(217, 119, 6, 0.3);
    }

    .btn-ebay .media-tag {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-bookoff .media-tag {
      background: rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.26);
    }

    /* Footer Note */
    .portal-footer {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Header -->
    <header class="portal-header">
      <div class="portal-badge">
        <span class="dot"></span>
        <span>Physical Media Directory</span>
      </div>
      <h1 class="portal-title">Tap to Visit Store</h1>
    </header>

    <!-- Pure Logo Buttons Grid with Physical Media Tags -->
    <nav class="buttons-grid" aria-label="Official Store Links">

      <!-- 1. Barnes & Noble -->
      <a href="https://www.barnesandnoble.com/" 
         class="logo-btn btn-bn" 
         target="_blank" 
         rel="noopener noreferrer"
         aria-label="Barnes & Noble">
        <div class="logo-box">
          <img src="assets/barnes-noble-light.svg?v=3" 
               alt="Barnes & Noble" 
               loading="eager" 
               fetchpriority="high" />
        </div>
        <div class="media-tags">
          <span class="media-tag">Books</span>
          <span class="media-tag">Manga</span>
          <span class="media-tag">Vinyl</span>
          <span class="media-tag">CD &amp; DVD</span>
        </div>
        <div class="logo-btn-link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </div>
      </a>

      <!-- 2. Hungry Ear Records -->
      <a href="https://hungryear.com/" 
         class="logo-btn btn-he" 
         target="_blank" 
         rel="noopener noreferrer"
         aria-label="Hungry Ear Records">
        <div class="logo-box">
          <img src="assets/hungry-ear.svg?v=3" 
               alt="Hungry Ear Records" 
               loading="eager" 
               fetchpriority="high" />
        </div>
        <div class="media-tags">
          <span class="media-tag">Vinyl</span>
          <span class="media-tag">CDs</span>
          <span class="media-tag">Cassettes</span>
          <span class="media-tag">Audio</span>
        </div>
        <div class="logo-btn-link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </div>
      </a>

      <!-- 3. eBay -->
      <a href="https://www.ebay.com/" 
         class="logo-btn btn-ebay" 
         target="_blank" 
         rel="noopener noreferrer"
         aria-label="eBay">
        <div class="logo-box">
          <img src="assets/ebay.svg?v=3" 
               alt="eBay" 
               loading="eager" 
               fetchpriority="high" />
        </div>
        <div class="media-tags">
          <span class="media-tag">Books</span>
          <span class="media-tag">Vinyl</span>
          <span class="media-tag">CD &amp; DVD</span>
          <span class="media-tag">Games</span>
        </div>
        <div class="logo-btn-link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </div>
      </a>

      <!-- 4. BOOK·OFF -->
      <a href="https://www.bookoffusa.com/" 
         class="logo-btn btn-bookoff" 
         target="_blank" 
         rel="noopener noreferrer"
         aria-label="BOOK OFF">
        <div class="logo-box">
          <img src="assets/book-off.png?v=3" 
               alt="BOOK OFF" 
               loading="eager" 
               fetchpriority="high" />
        </div>
        <div class="media-tags">
          <span class="media-tag">Books</span>
          <span class="media-tag">Manga</span>
          <span class="media-tag">CD &amp; DVD</span>
          <span class="media-tag">Games</span>
        </div>
        <div class="logo-btn-link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </div>
      </a>

    </nav>

    <!-- Footer -->
    <footer class="portal-footer">
      <p>© 2026 Physical Media Portal • Tap any card to open store</p>
    </footer>
  </main>

</body>
</html>
